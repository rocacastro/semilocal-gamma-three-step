name: supplementary-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check distributed file integrity
        run: python code/check_integrity.py
      - name: Install mathematical dependencies
        run: python -m pip install -r requirements.txt
      - name: Run exact, symbolic and published-results checks
        run: python code/run_verifications.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check supplied numerical data
        run: python code/verify_experiment_data.py
